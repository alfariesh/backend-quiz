$kind: http-request
name: Upload Media
method: POST
url: '{{base_url}}/api/v1/cards/{{card_id}}/media'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: card_id
    value: '{{card_id}}'
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
