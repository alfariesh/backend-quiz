$kind: http-request
name: Delete Question
method: DELETE
url: '{{base_url}}/api/v1/quizzes/{{quiz_id}}/questions/{{question_id}}'
order: 6000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: quiz_id
    value: '{{quiz_id}}'
  - key: question_id
    value: '{{question_id}}'
