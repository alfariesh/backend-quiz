$kind: http-request
name: Generate Questions from Deck
method: POST
url: '{{base_url}}/api/v1/quizzes/{{quiz_id}}/questions/generate'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: quiz_id
    value: '{{quiz_id}}'
body:
  type: json
  content: |-
    {
      "deck_id": "{{deck_id}}",
      "question_type": "mcq",
      "count": 10
    }
