$kind: http-request
name: Add Question
method: POST
url: '{{base_url}}/api/v1/quizzes/{{quiz_id}}/questions'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: quiz_id
    value: '{{quiz_id}}'
body:
  type: json
  content: |-
    {
      "card_id": null,
      "question_type": "mcq",
      "question_text": "What is X?",
      "options": [
        {"label": "A", "text": "Option A"},
        {"label": "B", "text": "Option B"}
      ],
      "correct_answer": "A",
      "explanation": "Because...",
      "points": 1
    }
