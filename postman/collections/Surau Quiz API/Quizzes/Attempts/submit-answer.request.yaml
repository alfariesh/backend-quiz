$kind: http-request
name: Submit Answer
method: POST
url: '{{base_url}}/api/v1/quizzes/{{quiz_id}}/attempts/{{attempt_id}}/answer'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: quiz_id
    value: '{{quiz_id}}'
  - key: attempt_id
    value: '{{attempt_id}}'
body:
  type: json
  content: |-
    {
      "question_id": "{{question_id}}",
      "answer": "A",
      "duration_ms": 3000,
      "rating": 3,
      "fsrs_card": {
        "due": "2026-04-09T00:00:00Z",
        "stability": 2.5,
        "difficulty": 5.0,
        "elapsed_days": 1,
        "scheduled_days": 3,
        "reps": 1,
        "lapses": 0,
        "state": 1,
        "last_review": "2026-04-08T00:00:00Z"
      },
      "fsrs_log": {
        "scheduled_days": 3,
        "elapsed_days": 1,
        "stability": 2.5,
        "difficulty": 5.0
      }
    }
