$kind: http-request
name: Get Attempt
method: GET
url: '{{base_url}}/api/v1/quizzes/{{quiz_id}}/attempts/{{attempt_id}}'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: quiz_id
    value: '{{quiz_id}}'
  - key: attempt_id
    value: '{{attempt_id}}'
