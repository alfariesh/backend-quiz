$kind: http-request
name: Import Deck
method: POST
url: '{{base_url}}/api/v1/decks/import'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
body:
  type: json
  content: |-
    {
      "name": "Imported Deck",
      "cards": [
        {
          "front": "Question",
          "back": "Answer",
          "tags": ["tag1"]
        }
      ]
    }
