$kind: http-request
name: Share Deck
method: POST
url: '{{base_url}}/api/v1/decks/{{deck_id}}/share'
order: 10000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: deck_id
    value: '{{deck_id}}'
body:
  type: json
  content: |-
    {
      "is_public": true
    }
