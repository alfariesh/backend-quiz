$kind: http-request
name: Update Deck
method: PUT
url: '{{base_url}}/api/v1/decks/{{deck_id}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: deck_id
    value: '{{deck_id}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Name",
      "description": "Updated desc",
      "is_archived": false,
      "new_cards_per_day": 20,
      "position": 0
    }
