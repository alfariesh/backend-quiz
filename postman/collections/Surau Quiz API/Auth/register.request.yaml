$kind: http-request
name: Register
method: POST
url: '{{base_url}}/api/v1/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "password": "password123",
      "display_name": "John Doe"
    }
