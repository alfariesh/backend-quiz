$kind: http-request
name: Update Profile
method: PUT
url: '{{base_url}}/api/v1/auth/me'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
body:
  type: json
  content: |-
    {
      "display_name": "John Doe",
      "timezone": "UTC",
      "desired_retention": 0.9,
      "daily_new_limit": 20,
      "daily_review_limit": 200,
      "fsrs_weights": [
        0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14,
        0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61, 0.23, 2.74
      ],
      "reminder_enabled": true,
      "reminder_time": "08:00"
    }
