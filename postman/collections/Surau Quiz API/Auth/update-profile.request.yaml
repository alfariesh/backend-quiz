$kind: http-request
name: Update Profile
method: PUT
url: '{{base_url}}/api/v1/auth/me'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
body:
  type: json
  content: |-
    {
      "display_name": "John Doe",
      "timezone": "UTC",
      "desired_retention": 0.9,
      "daily_new_limit": 20,
      "daily_review_limit": 200
    }
