$kind: http-request
name: Create Card
method: POST
url: '{{base_url}}/api/v1/decks/{{deck_id}}/cards'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: deck_id
    value: '{{deck_id}}'
body:
  type: json
  content: |-
    {
      "front": "What is X?",
      "back": "X is Y",
      "content_type": "plain",
      "tags": ["tag1"]
    }
