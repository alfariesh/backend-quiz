$kind: http-request
name: List Cards
method: GET
url: '{{base_url}}/api/v1/decks/{{deck_id}}/cards'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: deck_id
    value: '{{deck_id}}'
queryParams:
  - key: tag
    value: ''
    disabled: true
  - key: q
    value: ''
    disabled: true
  - key: state
    value: ''
    disabled: true
  - key: limit
    value: '20'
    disabled: true
  - key: offset
    value: '0'
    disabled: true
