$kind: http-request
name: Update Card
method: PUT
url: '{{base_url}}/api/v1/cards/{{card_id}}'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
pathVariables:
  - key: card_id
    value: '{{card_id}}'
body:
  type: json
  content: |-
    {
      "front": "Updated Q",
      "back": "Updated A",
      "content_type": "plain",
      "tags": ["tag1"]
    }
