services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flashcard
      POSTGRES_PASSWORD: flashcard
      POSTGRES_DB: flashcard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashcard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      dockerfile: Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      [
        "-dir", "/migrations",
        "postgres",
        "postgres://flashcard:flashcard@postgres:5432/flashcard?sslmode=disable",
        "up",
      ]

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://flashcard:flashcard@postgres:5432/flashcard?sslmode=disable
      REDIS_ADDR: redis:6379
      RAG_SERVICE_URL: http://rag-service:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rag-service:
        condition: service_healthy
    restart: unless-stopped

  rag-service:
    build: ./rag-service
    env_file:
      - ./rag-service/.env
    environment:
      DATABASE_URL: postgres://flashcard:flashcard@postgres:5432/flashcard?sslmode=disable
      HOST: 0.0.0.0
      PORT: 8001
      # Shared secret with Go api. Source of truth: root .env (RAG_INTERNAL_TOKEN).
      # Empty string disables the check — do not leave empty in production.
      INTERNAL_AUTH_TOKEN: ${RAG_INTERNAL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
